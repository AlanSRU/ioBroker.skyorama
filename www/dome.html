<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Skyorama: the sky above home</title>
        <link rel="stylesheet" href="css/skyorama.css" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #05070d;
                color: #dfe6f3;
                font-family: system-ui, sans-serif;
                overflow: hidden;
            }
            main {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #dome {
                width: min(100vw, 100vh);
                height: min(100vw, 100vh);
                display: block;
            }
            #clock {
                position: fixed;
                top: 12px;
                left: 16px;
                font-size: 15px;
                font-weight: 600;
                opacity: 0.75;
            }
            /* the information box: below the compass button (phones: a sheet at the bottom) */
            @media (min-width: 641px) {
                .sky-info {
                    top: 48px;
                    max-height: calc(100vh - 60px);
                }
            }
            #compass {
                position: fixed;
                top: 8px;
                right: 12px;
                padding: 6px 12px;
                border: 1px solid rgba(255, 255, 255, 0.35);
                border-radius: 16px;
                background: rgba(20, 26, 40, 0.7);
                color: inherit;
                font: inherit;
                font-size: 14px;
            }
            #compass[aria-pressed='true'] {
                background: rgba(70, 120, 200, 0.85);
            }
            #status {
                position: fixed;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                max-width: calc(100vw - 32px);
                padding: 8px 14px;
                border-radius: 8px;
                background: rgba(20, 26, 40, 0.85);
                font-size: 14px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <main><canvas id="dome" aria-label="The sky above home"></canvas></main>
        <div id="clock"></div>
        <button id="compass" type="button" aria-pressed="false" hidden>Compass</button>
        <div id="status" role="status"></div>
        <script src="../lib/js/socket.io.js"></script>
        <script src="js/common.js"></script>
        <script src="js/info.js"></script>
        <script src="js/skydata.js"></script>
        <script src="js/dome.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
